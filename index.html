<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prenotazione Testimonianza Pubblica</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #F7F6F2;
    overflow: hidden;
  }
  #loader {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    color: #7A7974;
    font-size: 15px;
    background: #F7F6F2;
    z-index: 1;
  }
  iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #F7F6F2;
  }
</style>
</head>
<body>
  <div id="loader">Caricamento...</div>
  <!--
    Sostituisci l'URL nella costante BASE_URL qui sotto con il TUO link
    ufficiale /exec (quello che trovi in Link_definitivo_app.md), se
    dovesse mai cambiare a seguito di una NUOVA distribuzione (non serve
    cambiarlo per una semplice "Nuova versione" della stessa distribuzione).
    Il src dell'iframe NON è più scritto qui in modo statico: viene
    impostato dallo script qui sotto, che ritrasmette all'app anche un
    eventuale parametro ?u=CODICE (QR personale di un utente).
  -->
  <iframe
    id="appFrame"
    title="Prenotazione Testimonianza Pubblica"
    allow="clipboard-write"
    onload="document.getElementById('loader').style.display='none'">
  </iframe>
  <script>
    (function () {
      var BASE_URL = 'https://script.google.com/macros/s/AKfycbzx9dE-lls0NsixSaWiYXAdmCpCr_ZDisCny5MJpKnAFrtXP4RaS_twRv4g7ceu0xo_/exec';
      // Se questa pagina è stata aperta con ?u=CODICE (link nel QR personale
      // stampato su una scheda utente), lo ritrasmettiamo all'app dentro
      // l'iframe: l'utente trova il proprio codice già inserito e l'accesso
      // avviato automaticamente, senza doverlo ridigitare a mano.
      var codice = new URLSearchParams(window.location.search).get('u');
      document.getElementById('appFrame').src = codice ? (BASE_URL + '?u=' + encodeURIComponent(codice)) : BASE_URL;
    })();
  </script>
</body>
</html>
